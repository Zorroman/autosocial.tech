name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-stack rebuild from scratch (--no-cache), independent of the
    # per-push e2e job below, as a periodic check against Docker layer/cache
    # drift.
    - cron: "0 6 * * 1"

jobs:
  # --- fast jobs: run on every push/PR, no Docker involved ---

  pytest:
    runs-on: ubuntu-latest
    env:
      USE_MOCK_PROVIDERS: "true"
      SYNC_JOBS: "true"
      DATABASE_URL: "sqlite:///./ci_autosocial.db"
      SECRET_KEY: "ci-test-secret-key"
      FACTORY_SCHEDULER_ENABLED: "false"
      LONGFORM_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Run ruff
        run: ruff check .

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env from the committed example
        run: cp .env.example .env

      - name: Validate docker compose config
        run: docker compose config -q

  # --- e2e job: full Docker Compose stack + real Playwright smoke.
  # Runs on every push/PR alongside the fast jobs above, kept as its own job
  # so a slow/flaky Docker layer doesn't block the fast pytest/lint/gitleaks
  # signal. See the scheduled job below for a periodic --no-cache rebuild.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env from the committed example
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"; docker compose logs backend; exit 1

      - name: Seed demo data (admin, channel, sample projects)
        run: |
          docker compose exec -T backend python seed_admin.py
          docker compose exec -T backend python seed_channel.py
          docker compose exec -T backend python scripts/seed_demo_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the real full-stack Playwright smoke
        working-directory: tests/e2e
        env:
          E2E_API_BASE_URL: http://localhost:5000
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/reports/playwright

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # --- scheduled/manual job: same real smoke, but from a genuinely fresh
  # --no-cache build, run weekly (or on demand) rather than on every push --
  # catches Docker layer-cache drift the per-push e2e job above wouldn't.
  full-stack-scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env from the committed example
        run: cp .env.example .env

      - name: Build images (no cache)
        run: docker compose build --no-cache

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health; then exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"; docker compose logs backend; exit 1

      - name: Seed demo data (admin, channel, sample projects)
        run: |
          docker compose exec -T backend python seed_admin.py
          docker compose exec -T backend python seed_channel.py
          docker compose exec -T backend python scripts/seed_demo_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the real full-stack Playwright smoke
        working-directory: tests/e2e
        env:
          E2E_API_BASE_URL: http://localhost:5000
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-scheduled
          path: tests/reports/playwright

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
