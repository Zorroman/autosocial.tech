  <body class="notranslate" translate="no">
    <div id="siteLangSwitcher" class="site-lang-switcher notranslate" translate="no">
      <label for="siteLangSelect">Язык</label>
      <select id="siteLangSelect" class="notranslate" translate="no" aria-label="Site language">
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
        <option value="en">English</option>
        <option value="es">Espanol</option>
        <option value="de">Deutsch</option>
        <option value="fr">Francais</option>
      </select>

    <div id="app" class="notranslate" translate="no"></div>
    <script src="/wizard_utils.js?v=yt-oauth-fix-28"></script>
    <script>
      (function () {
        var defaultLang = 'ru';
        var allowed = ['ru', 'uk', 'en', 'es', 'de', 'fr'];
        var select = document.getElementById('siteLangSelect');
        var host = String(window.location.hostname || '').replace(/^www\./, '');
        function normalizeLang(v) {
          var raw = String(v || '').toLowerCase().trim();
          if (!raw) return '';
          var shortCode = raw.split('-')[0];
          return allowed.indexOf(shortCode) >= 0 ? shortCode : '';
        }
        function setCookieRaw(name, value, days, domain) {
          var expires = '';
          if (days) {
            var date = new Date();
            date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
            expires = '; expires=' + date.toUTCString();
          }
          var domainPart = domain ? '; domain=' + domain : '';
          var securePart = window.location.protocol === 'https:' ? '; Secure' : '';
          document.cookie = name + '=' + value + expires + '; path=/' + domainPart + '; SameSite=Lax' + securePart;
        }
        function setCookie(name, value, days) {
          setCookieRaw(name, value, days, '');
          if (host && host.indexOf('.') > 0) setCookieRaw(name, value, days, '.' + host);
        }
        function removeCookieRaw(name, domain) {
          var domainPart = domain ? '; domain=' + domain : '';
          var securePart = window.location.protocol === 'https:' ? '; Secure' : '';
          document.cookie = name + '=; Max-Age=0; path=/' + domainPart + '; SameSite=Lax' + securePart;
        }
        function removeCookie(name) {
          removeCookieRaw(name, '');
          if (host && host.indexOf('.') > 0) removeCookieRaw(name, '.' + host);
        }
        function applyGoogleCombo(lang) {
          var normalized = normalizeLang(lang) || defaultLang;
          var combo = document.querySelector('.goog-te-combo');
          if (!combo) return false;
          if (normalized === defaultLang) {
            combo.value = defaultLang;
          } else {
            combo.value = normalized;
          }
          combo.dispatchEvent(new Event('change'));
          return true;
        }
        function enforceLanguage(lang) {
          var normalized = normalizeLang(lang) || defaultLang;
          if (normalized === defaultLang) return;
          var tries = 0;
          var timer = setInterval(function () {
            tries += 1;
            if (applyGoogleCombo(normalized) || tries >= 24) clearInterval(timer);
          }, 160);
        }
        function forceHideTranslateBanner() {
          document.documentElement.style.top = '0px';
          document.body.style.top = '0px';
          document.documentElement.style.marginTop = '0px';
          document.body.style.marginTop = '0px';
          var frames = document.querySelectorAll('iframe.goog-te-banner-frame');
          for (var i = 0; i < frames.length; i += 1) {
            var frame = frames[i];
            if (!frame) continue;
            frame.style.display = 'none';
          }
          var banner = document.querySelector('.goog-te-banner-frame.skiptranslate');
          if (banner) banner.style.display = 'none';
        }
        function attachTranslateBannerGuards() {
          forceHideTranslateBanner();
          setTimeout(forceHideTranslateBanner, 150);
          setTimeout(forceHideTranslateBanner, 500);
          setTimeout(forceHideTranslateBanner, 1200);
          if (window.__gtBannerObserverAttached) return;
          window.__gtBannerObserverAttached = true;
          var observer = new MutationObserver(function () {
            forceHideTranslateBanner();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
        }
        function ensureGoogleTranslateLoaded() {
          if (window.__gtScriptRequested) return;
          window.__gtScriptRequested = true;
          var script = document.createElement('script');
          script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
          script.async = true;
          document.body.appendChild(script);
        }
        function applyLang(lang) {
          var normalized = normalizeLang(lang) || defaultLang;
          localStorage.setItem('siteLang', normalized);
          localStorage.setItem('lang', normalized);
          if (select) select.value = normalized;
          document.documentElement.setAttribute('lang', normalized);
          if (normalized === defaultLang) {
            removeCookie('googtrans');
          } else {
            setCookie('googtrans', '/ru/' + normalized, 365);
          }
          forceHideTranslateBanner();
          if (normalized === defaultLang) {
            try {
              var resetCombo = document.querySelector('.goog-te-combo');
              if (resetCombo) {
                resetCombo.value = defaultLang;
                resetCombo.dispatchEvent(new Event('change'));
              }
            } catch (e) {}
            return;
          }
          ensureGoogleTranslateLoaded();
          enforceLanguage(normalized);
        }
        function detectInitialLang() {
          var saved = normalizeLang(localStorage.getItem('lang') || localStorage.getItem('siteLang'));
          if (saved) return saved;
          var browserLang = normalizeLang(navigator.language || '');
          return browserLang || defaultLang;
        }
        window.__applySiteLanguage = applyLang;
        window.googleTranslateElementInit = function () {
          if (!window.google || !google.translate || !google.translate.TranslateElement) return;
          new google.translate.TranslateElement(
            {
              pageLanguage: 'ru',
              includedLanguages: 'ru,uk,en,es,de,fr',
              autoDisplay: false,
              layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            },
            'google_translate_element'
          );
          attachTranslateBannerGuards();
          enforceLanguage(detectInitialLang());
        };
        var initial = detectInitialLang();
        document.documentElement.setAttribute('lang', initial);
        localStorage.setItem('siteLang', initial);
        localStorage.setItem('lang', initial);
        if (initial === defaultLang) {
          removeCookie('googtrans');
        } else {
          setCookie('googtrans', '/ru/' + initial, 365);
        }
        if (select) {
          select.value = initial;
          select.addEventListener('change', function () {
            applyLang(select.value);
          });
        }
        attachTranslateBannerGuards();
        if (initial !== defaultLang) ensureGoogleTranslateLoaded();
      })();
    </script>
