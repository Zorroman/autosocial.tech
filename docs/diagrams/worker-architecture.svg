<svg viewBox="0 0 800 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="680" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Worker Architecture — one RQ worker process (worker.py)</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#64748b">Liveness = RQ's own Worker.all() registration, not a custom heartbeat-age threshold</text>

  <rect x="220" y="85" width="360" height="60" rx="10" fill="url(#g1)"/>
  <text x="400" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">rq.Worker main loop</text>
  <text x="400" y="130" text-anchor="middle" font-size="11" fill="#e0e7ff">blocking dequeue on the "render" queue</text>

  <path d="M400 145 V175" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="175" width="360" height="70" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Dequeue returns → heartbeat refreshed</text>
  <text x="400" y="218" text-anchor="middle" font-size="11" fill="#64748b">Registration TTL renewed to worker_ttl + 60 (default 480s)</text>
  <text x="400" y="233" text-anchor="middle" font-size="10" fill="#94a3b8">at most every worker_ttl - 15 (~405s) — this is RQ's design, not a bug</text>

  <path d="M400 245 V275" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="275" width="360" height="60" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Executes the job function</text>
  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#64748b">render / generate-script / footage fetch</text>

  <path d="M400 335 V365" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="365" width="360" height="60" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Updates RenderJob row in Postgres</text>
  <text x="400" y="410" text-anchor="middle" font-size="11" fill="#64748b">status: running → done / failed</text>

  <path d="M400 425 Q400 445 400 175" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)" transform="translate(0,0)"/>
  <path d="M580 205 H680 V175" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <text x="700" y="200" font-size="10" fill="#64748b">loop</text>

  <!-- health check box -->
  <rect x="60" y="470" width="680" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="496" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">/api/readiness worker check</text>
  <text x="400" y="518" text-anchor="middle" font-size="11.5" fill="#334155">online = bool(Worker.all(connection=redis))</text>
  <text x="400" y="538" text-anchor="middle" font-size="11" fill="#64748b">Trusts RQ's own registration-key expiry (worker_ttl + 60), not a shorter invented threshold.</text>
  <text x="400" y="556" text-anchor="middle" font-size="11" fill="#64748b">Fixed after a real incident: a 120s threshold flagged an idle-but-healthy worker "Offline"</text>
  <text x="400" y="572" text-anchor="middle" font-size="11" fill="#64748b">because jobs run ~48 min apart — see CASE_STUDIES.md #2.</text>
  <text x="400" y="590" text-anchor="middle" font-size="10" fill="#94a3b8">factory_dashboard_api.py :: _worker_status</text>

  <path d="M400 425 V470" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="440" y="450" font-size="10" fill="#64748b">read by</text>

  <rect x="60" y="630" width="680" height="36" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="400" y="653" text-anchor="middle" font-size="11" fill="#334155">Idle for a long stretch between jobs is normal here — it is not the same thing as offline.</text>
</svg>
