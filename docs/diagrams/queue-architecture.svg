<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Queue Architecture — one shared queue, one worker, on purpose</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#64748b">See ADR-002 / ADR-003 — never two memory-hungry renders at once</text>

  <rect x="40" y="90" width="220" height="80" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
  <text x="150" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Flask API</text>
  <text x="150" y="140" text-anchor="middle" font-size="11" fill="#64748b">POST /render, /generate-script,</text>
  <text x="150" y="155" text-anchor="middle" font-size="11" fill="#64748b">/video-projects/{id}/render</text>

  <path d="M260 130 H340" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="120" text-anchor="middle" font-size="10" fill="#64748b">enqueue()</text>

  <rect x="340" y="90" width="220" height="80" rx="10" fill="url(#g1)"/>
  <text x="450" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Redis</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#e0e7ff">single "render" queue</text>
  <text x="450" y="155" text-anchor="middle" font-size="11" fill="#e0e7ff">Shorts + long-form share it</text>

  <path d="M560 130 H640" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="120" text-anchor="middle" font-size="10" fill="#64748b">dequeue()</text>

  <rect x="640" y="90" width="120" height="80" rx="10" fill="#ffffff" stroke="#8B5CF6" stroke-width="2"/>
  <text x="700" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">RQ worker</text>
  <text x="700" y="140" text-anchor="middle" font-size="11" fill="#64748b">exactly 1</text>
  <text x="700" y="155" text-anchor="middle" font-size="11" fill="#64748b">process</text>

  <path d="M150 170 V210" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="40" y="210" width="220" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">SYNC_JOBS=true</text>
  <text x="150" y="252" text-anchor="middle" font-size="10.5" fill="#64748b">tests / local dev: runs inline,</text>
  <text x="150" y="264" text-anchor="middle" font-size="10.5" fill="#64748b">bypasses Redis entirely</text>

  <path d="M700 170 V300" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="500" y="300" width="260" height="90" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="630" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Postgres</text>
  <text x="630" y="344" text-anchor="middle" font-size="11" fill="#64748b">RenderJob.status updated:</text>
  <text x="630" y="360" text-anchor="middle" font-size="11" fill="#64748b">queued → running → done/failed</text>
  <text x="630" y="376" text-anchor="middle" font-size="10" fill="#94a3b8">polled by the dashboard, not pushed</text>

  <rect x="60" y="300" width="360" height="90" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="240" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Duplicate-render guard</text>
  <text x="240" y="344" text-anchor="middle" font-size="11" fill="#64748b">A pending/running job for the same project</text>
  <text x="240" y="359" text-anchor="middle" font-size="11" fill="#64748b">→ new render request returns 409, not a 2nd job</text>
  <text x="240" y="376" text-anchor="middle" font-size="10" fill="#94a3b8">tested: test_duplicate_render_protection</text>

  <path d="M420 340 H500" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="120" y="430" width="560" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="400" y="454" text-anchor="middle" font-size="11.5" fill="#334155">Effective throughput ceiling: one render at a time. Shorts paced ~48 min apart,</text>
  <text x="400" y="472" text-anchor="middle" font-size="11.5" fill="#334155">one long-form video/day — comfortably inside that ceiling (verified, not assumed).</text>
</svg>
