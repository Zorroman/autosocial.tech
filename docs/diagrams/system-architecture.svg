<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">System Architecture — single VPS, Docker Compose</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#64748b">Hetzner CPX22 · 2 vCPU · 3.8 GB RAM · no swap</text>

  <!-- Browser -->
  <rect x="30" y="90" width="150" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="123" text-anchor="middle" font-size="13" fill="#0f172a">Browser (SPA)</text>

  <!-- YouTube -->
  <rect x="720" y="90" width="150" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="795" y="118" text-anchor="middle" font-size="13" fill="#0f172a">YouTube</text>
  <text x="795" y="134" text-anchor="middle" font-size="11" fill="#64748b">Data + upload API</text>

  <!-- Caddy -->
  <rect x="330" y="90" width="240" height="56" rx="10" fill="url(#g1)"/>
  <text x="450" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Caddy</text>
  <text x="450" y="133" text-anchor="middle" font-size="11" fill="#e0e7ff">Reverse proxy · TLS · static frontend</text>

  <!-- Backend -->
  <rect x="150" y="210" width="240" height="70" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
  <text x="270" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">backend</text>
  <text x="270" y="256" text-anchor="middle" font-size="11" fill="#64748b">Flask API · runs migrations on boot</text>
  <text x="270" y="271" text-anchor="middle" font-size="11" fill="#64748b">saas_api.py + blueprints</text>

  <!-- Worker -->
  <rect x="510" y="210" width="240" height="70" rx="10" fill="#ffffff" stroke="#8B5CF6" stroke-width="2"/>
  <text x="630" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">worker</text>
  <text x="630" y="256" text-anchor="middle" font-size="11" fill="#64748b">1 RQ worker · Shorts + long-form schedulers</text>
  <text x="630" y="271" text-anchor="middle" font-size="11" fill="#64748b">worker.py, scheduler.py, longform_scheduler.py</text>

  <!-- Postgres -->
  <rect x="120" y="360" width="200" height="70" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="220" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">postgres</text>
  <text x="220" y="408" text-anchor="middle" font-size="11" fill="#64748b">channels, projects, jobs, publications</text>

  <!-- Redis -->
  <rect x="580" y="360" width="200" height="70" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="680" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">redis</text>
  <text x="680" y="408" text-anchor="middle" font-size="11" fill="#64748b">RQ queue · worker heartbeat/registration</text>

  <!-- Filesystem -->
  <rect x="330" y="480" width="240" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="506" text-anchor="middle" font-size="13" fill="#0f172a">Shared volume</text>
  <text x="450" y="524" text-anchor="middle" font-size="11" fill="#64748b">cache/footage, output/videos, output/audio</text>

  <!-- arrows -->
  <path d="M180 118 H330" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M570 118 H720" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 146 L300 210" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M270 280 V360" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 245 H510" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M630 280 V360" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M630 280 Q470 320 320 380" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
  <path d="M310 430 Q380 460 400 480" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M590 430 Q520 460 500 480" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M700 245 Q810 300 810 145" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="3,3"/>

  <text x="450" y="580" text-anchor="middle" font-size="11" fill="#64748b">backend and worker build from the same Dockerfile.backend but deploy as independently tagged images —</text>
  <text x="450" y="596" text-anchor="middle" font-size="11" fill="#64748b">a backend-only fix rebuilds/restarts without touching an in-flight render on the worker.</text>
</svg>
