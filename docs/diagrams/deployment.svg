<svg viewBox="0 0 820 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="820" height="760" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Deployment — manual, SSH-driven, but gated like a pipeline</text>
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#64748b">See ADR-001 and DEPLOYMENT.md — why not GitOps yet, and the real procedure</text>

  <g font-size="12">
    <rect x="60" y="80" width="230" height="56" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
    <text x="175" y="105" text-anchor="middle" font-weight="700" fill="#0f172a">1. Full test suite</text>
    <text x="175" y="122" text-anchor="middle" font-size="10.5" fill="#64748b">269 tests, mocked providers</text>

    <rect x="60" y="156" width="230" height="56" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
    <text x="175" y="181" text-anchor="middle" font-weight="700" fill="#0f172a">2. In-flight job check</text>
    <text x="175" y="198" text-anchor="middle" font-size="10.5" fill="#64748b">never deploy over a running render</text>

    <rect x="60" y="232" width="230" height="56" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
    <text x="175" y="257" text-anchor="middle" font-weight="700" fill="#0f172a">3. Backup</text>
    <text x="175" y="274" text-anchor="middle" font-size="10.5" fill="#64748b">Postgres dump + previous release tarball</text>

    <rect x="60" y="308" width="230" height="56" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
    <text x="175" y="333" text-anchor="middle" font-weight="700" fill="#0f172a">4. Ship only what changed</text>
    <text x="175" y="350" text-anchor="middle" font-size="10.5" fill="#64748b">rebuild only backend or worker, not both</text>

    <rect x="60" y="384" width="230" height="56" rx="10" fill="url(#g1)"/>
    <text x="175" y="409" text-anchor="middle" font-weight="700" fill="#ffffff">5. Migrate</text>
    <text x="175" y="426" text-anchor="middle" font-size="10.5" fill="#e0e7ff">run_migrations() on backend boot</text>

    <rect x="60" y="460" width="230" height="56" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
    <text x="175" y="485" text-anchor="middle" font-weight="700" fill="#0f172a">6. Restart the changed service</text>
    <text x="175" y="502" text-anchor="middle" font-size="10.5" fill="#64748b">worker never restarts mid-render</text>
  </g>

  <path d="M175 136 V156" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M175 212 V232" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M175 288 V308" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M175 364 V384" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M175 440 V460" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M290 488 H360" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="360" y="384" width="290" height="200" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="505" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">7. Post-deploy verification</text>
  <text x="505" y="432" text-anchor="middle" font-size="11" fill="#64748b">/api/health responds</text>
  <text x="505" y="450" text-anchor="middle" font-size="11" fill="#64748b">/api/readiness dependency checks pass</text>
  <text x="505" y="468" text-anchor="middle" font-size="11" fill="#64748b">a real regression check waited out, not</text>
  <text x="505" y="484" text-anchor="middle" font-size="11" fill="#64748b">declared immediately after restart</text>
  <text x="505" y="506" text-anchor="middle" font-size="10.5" fill="#94a3b8">example: the heartbeat-fix deploy waited</text>
  <text x="505" y="522" text-anchor="middle" font-size="10.5" fill="#94a3b8">130s so heartbeat age exceeded the old,</text>
  <text x="505" y="538" text-anchor="middle" font-size="10.5" fill="#94a3b8">broken 120s threshold before checking —</text>
  <text x="505" y="554" text-anchor="middle" font-size="10.5" fill="#94a3b8">an immediate check couldn't have proven</text>
  <text x="505" y="570" text-anchor="middle" font-size="10.5" fill="#94a3b8">the fix actually worked.</text>

  <path d="M505 384 Q505 350 290 322" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <path d="M650 460 H700" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="720" y="450" font-size="10.5" fill="#ef4444" text-anchor="middle">fails</text>

  <rect x="600" y="640" width="160" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="680" y="666" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Rollback</text>
  <text x="680" y="684" text-anchor="middle" font-size="10.5" fill="#7f1d1d">scripts/rollback.sh</text>
  <text x="680" y="698" text-anchor="middle" font-size="10.5" fill="#7f1d1d">.prev_release_commit</text>

  <path d="M700 460 Q760 500 760 640 Q760 660 700 660" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="640" width="480" height="70" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="666" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Deploy complete</text>
  <text x="300" y="684" text-anchor="middle" font-size="10.5" fill="#14532d">verified against real running state, not assumed from a clean restart</text>
  <path d="M505 584 Q505 620 300 640" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="440" y="618" font-size="10.5" fill="#22c55e" text-anchor="middle">passes</text>
</svg>
