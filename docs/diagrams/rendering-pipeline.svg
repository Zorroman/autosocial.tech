<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="620" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Rendering Pipeline — memory bounded by one segment, not video length</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#64748b">See CASE_STUDIES.md #1 and SYSTEM_DESIGN.md — peak RSS 383–623 MB regardless of duration</text>

  <!-- segments row -->
  <text x="60" y="95" font-size="12" font-weight="700" fill="#0f172a">Timeline (N scenes)</text>
  <g font-size="11" fill="#334155">
    <rect x="60" y="105" width="80" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="100" y="132" text-anchor="middle">Scene 1</text>
    <rect x="150" y="105" width="80" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="190" y="132" text-anchor="middle">Scene 2</text>
    <rect x="240" y="105" width="80" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="280" y="132" text-anchor="middle">Scene 3</text>
    <text x="345" y="132" font-size="16" fill="#94a3b8">…</text>
    <rect x="380" y="105" width="80" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="420" y="132" text-anchor="middle">Scene N</text>
  </g>

  <path d="M400 155 V190" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="620" y="180" font-size="11" fill="#64748b" text-anchor="middle">one short-lived FFmpeg</text>
  <text x="620" y="194" font-size="11" fill="#64748b" text-anchor="middle">process per segment</text>

  <rect x="150" y="190" width="500" height="66" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Per-segment render (one FFmpeg process each)</text>
  <text x="400" y="234" text-anchor="middle" font-size="11" fill="#64748b">Decodes only this segment's inputs — never the whole timeline at once</text>
  <text x="400" y="249" text-anchor="middle" font-size="10" fill="#94a3b8">longform_render.py</text>

  <path d="M400 256 V286" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="150" y="286" width="500" height="66" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2"/>
  <text x="400" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Group into chunks, stream-copy (-c copy)</text>
  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#64748b">No re-encode — concatenates segment files cheaply</text>
  <text x="400" y="345" text-anchor="middle" font-size="10" fill="#94a3b8">real intermediate files on disk, not held in memory</text>

  <path d="M400 352 V382" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="150" y="382" width="500" height="66" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ffprobe verification per chunk</text>
  <text x="400" y="426" text-anchor="middle" font-size="11" fill="#64748b">Confirms each chunk is a valid, complete media file before continuing</text>
  <text x="400" y="441" text-anchor="middle" font-size="10" fill="#94a3b8">a killed render can resume from the last verified chunk</text>

  <path d="M400 448 V478" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="150" y="478" width="500" height="66" rx="10" fill="url(#g1)"/>
  <text x="400" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Stream-copy chunks into final output file</text>
  <text x="400" y="522" text-anchor="middle" font-size="11" fill="#e0e7ff">Handed to the AI Publisher / YouTube upload step</text>

  <rect x="60" y="570" width="680" height="40" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="400" y="594" text-anchor="middle" font-size="11.5" fill="#78350f">Rejected alternatives: bigger VPS (outside the given constraint), 720p downgrade (real quality loss) — see ADR/SYSTEM_DESIGN.md</text>
</svg>
